name: One-time production polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add favicon to PHP pages
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          logo = root / 'assets' / 'logo.svg'
          favicon = root / 'favicon.svg'
          if logo.exists() and not favicon.exists():
              favicon.write_text(logo.read_text(encoding='utf-8'), encoding='utf-8')

          favicon_tag = '<link rel="icon" type="image/svg+xml" href="<?= defined(\'BASE_URL\') ? BASE_URL : \'/\' ?>favicon.svg" />'

          for path in root.rglob('*.php'):
              if '.git' in path.parts:
                  continue
              if path.parts[:1] == ('tools',):
                  continue

              text = path.read_text(encoding='utf-8')
              if '<head' not in text.lower() or 'rel="icon"' in text.lower():
                  continue

              updated = re.sub(r'(<head[^>]*>)', r'\1\n    ' + favicon_tag, text, count=1, flags=re.IGNORECASE)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add favicon.svg '**/*.php' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No favicon changes required."
            exit 0
          fi

          git commit -m "feat: add Samaaroh favicon across PHP pages"
          git push

      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/one-time-polish.yml
          git commit -m "chore: remove one-time production polish workflow"
          git push
