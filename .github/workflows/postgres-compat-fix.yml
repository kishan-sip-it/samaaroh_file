name: PostgreSQL compatibility fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch PostgreSQL-incompatible legacy queries
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          changed = []

          # Legacy MySQL TINYINT(1) values may exist as PostgreSQL BOOLEAN.
          # These predicates work with either representation.
          replacements = [
              (r'\bu\.is_verified\s*=\s*1\b', "CAST(u.is_verified AS TEXT) IN ('1','t','true')"),
              (r'\bu\.is_verified\s*=\s*0\b', "CAST(u.is_verified AS TEXT) IN ('0','f','false')"),
              (r'\bs\.is_available\s*=\s*1\b', "CAST(s.is_available AS TEXT) IN ('1','t','true')"),
              (r'\bs\.is_available\s*=\s*0\b', "CAST(s.is_available AS TEXT) IN ('0','f','false')"),
              (r'\bis_verified\s*=\s*1\b', "CAST(is_verified AS TEXT) IN ('1','t','true')"),
              (r'\bis_verified\s*=\s*0\b', "CAST(is_verified AS TEXT) IN ('0','f','false')"),
              (r'\bis_available\s*=\s*1\b', "CAST(is_available AS TEXT) IN ('1','t','true')"),
              (r'\bis_available\s*=\s*0\b', "CAST(is_available AS TEXT) IN ('0','f','false')"),
          ]

          for path in root.rglob('*.php'):
              if '.git' in path.parts or path.as_posix().startswith('tools/'):
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for pattern, replacement in replacements:
                  updated = re.sub(pattern, replacement, updated)

              # customer/dashboard.php used GROUP BY s.id while selecting
              # u.name/u.phone. PostgreSQL correctly rejects that query.
              if path.as_posix() == 'customer/dashboard.php':
                  updated = updated.replace(
                      'COUNT(DISTINCT b.id) as booking_count',
                      '(SELECT COUNT(*) FROM bookings b2 WHERE b2.service_id = s.id) as booking_count'
                  )
                  updated = updated.replace(
                      'LEFT JOIN bookings b ON s.id = b.service_id\n',
                      ''
                  )
                  updated = updated.replace('        GROUP BY s.id\n', '')

              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.as_posix())

          print('Changed files:', changed)

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No PostgreSQL compatibility changes required."
            exit 0
          fi
          git commit -m "fix: make Samaaroh queries PostgreSQL compatible"
          git push
