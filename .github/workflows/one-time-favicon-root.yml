name: Complete Samaaroh favicon rollout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  favicon:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add favicon to every PHP page
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          favicon_tag = '<link rel="icon" type="image/svg+xml" href="<?= defined(\'BASE_URL\') ? BASE_URL : \'/\' ?>favicon.svg" />'

          changed = []
          for path in root.rglob('*.php'):
              if '.git' in path.parts or path.parts[:1] == ('tools',):
                  continue

              text = path.read_text(encoding='utf-8')
              if re.search(r'rel=["\']icon["\']', text, flags=re.IGNORECASE):
                  continue
              if not re.search(r'<head[^>]*>', text, flags=re.IGNORECASE):
                  continue

              updated = re.sub(
                  r'(<head[^>]*>)',
                  r'\1\n    ' + favicon_tag,
                  text,
                  count=1,
                  flags=re.IGNORECASE,
              )

              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Favicon added to:', changed)

      - name: Commit favicon changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No favicon changes required."
            exit 0
          fi
          git commit -m "fix: add favicon to all Samaaroh PHP pages"
          git push

      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/one-time-favicon-root.yml
          git commit -m "chore: remove one-time favicon workflow"
          git push
